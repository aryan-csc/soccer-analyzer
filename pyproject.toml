[project]
name = "touchline-kick-lab"
version = "1.0.0"
description = "Local 2D soccer kicking biomechanics analysis with MediaPipe"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mediapipe==0.10.14", "opencv-contrib-python==4.10.0.84",
  "numpy==1.26.4", "pandas>=2.2,<3", "scipy>=1.13,<2",
  "jax==0.4.35", "jaxlib==0.4.35", "imageio-ffmpeg==0.6.0",
  "pydantic>=2.9,<3", "matplotlib>=3.8,<4"
]

[dependency-groups]
dev = ["pytest>=8,<10"]
dashboard = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1"]
dashboard-test = [{include-group = "dashboard"}, "httpx>=0.27,<1", "playwright>=1.49,<2"]
batch = ["snakemake>=8,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
